<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#7451c8">
    <title>TickIt by Eniola</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body class="min-h-screen text-slate-800 antialiased">
    <header class="hero-banner">
      <div class="hero-inner mx-auto flex max-w-7xl items-center justify-between gap-8 px-5 py-10 sm:px-8 lg:px-12">
        <div class="hero-copy">
          <div class="brand-lockup"><span class="brand-name">TickIt</span><span class="brand-byline">by Eniola</span></div>
          <h1>Tick it off.<br class="hidden sm:block"> Write it down.</h1>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-5 pb-16 pt-8 sm:px-8 lg:px-12 lg:pt-10">
      <div id="app-message" class="app-message hidden" role="status" aria-live="polite"></div>

      <div class="workspace-grid">
        <section class="workspace-column" aria-labelledby="tasks-heading">
          <div class="section-heading">
            <div>
              <h2 id="tasks-heading">Tasks</h2>
            </div>
            <span id="task-count" class="count-chip">0 tasks</span>
          </div>

          <form id="task-form" class="composer task-composer">
            <label class="sr-only" for="task-title">Task title</label>
            <div class="title-entry-row">
              <input id="task-title" name="title" type="text" maxlength="200" placeholder="Task title" required autocomplete="off">
              <button class="primary-button add-task-button" type="submit"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add task</span></button>
            </div>
            <div class="composer-options">
              <label class="field-label" for="task-due-date"><span aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24"><path d="M7 3v3m10-3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13H4V6a1 1 0 0 1 1-1Z"/></svg></span> Due date
                <input id="task-due-date" name="due_date" type="date">
              </label>
              <label class="field-label" for="task-priority"><span aria-hidden="true"><svg class="ui-icon" viewBox="0 0 24 24"><path d="m12 3 2.2 5.3L20 10l-4.4 3.5 1.3 5.7L12 16.3l-4.9 2.9 1.3-5.7L4 10l5.8-1.7L12 3Z"/></svg></span> Priority
                <select id="task-priority" name="priority">
                  <option value="low">Low</option>
                  <option value="medium" selected>Medium</option>
                  <option value="high">High</option>
                </select>
              </label>
            </div>
          </form>

          <div class="list-toolbar">
            <div class="filter-tabs" role="group" aria-label="Filter tasks">
              <button type="button" class="filter-button is-selected" data-filter="all" aria-pressed="true">All</button>
              <button type="button" class="filter-button" data-filter="active" aria-pressed="false">Active</button>
              <button type="button" class="filter-button" data-filter="completed" aria-pressed="false">Completed</button>
            </div>
          </div>
          <div id="task-list" class="item-list" aria-live="polite" aria-busy="true"></div>
        </section>

        <section class="workspace-column notes-column" aria-labelledby="notes-heading">
          <div class="section-heading">
            <div>
              <h2 id="notes-heading">Notes</h2>
            </div>
            <span id="note-count" class="count-chip count-chip-peach">0 notes</span>
          </div>

          <form id="note-form" class="composer note-composer">
            <label class="sr-only" for="note-title">Note title</label>
            <input id="note-title" name="title" type="text" maxlength="200" placeholder="Note title" required autocomplete="off">
            <label class="sr-only" for="note-content">Note content</label>
            <textarea id="note-content" name="content" rows="3" placeholder="Note content" required></textarea>
            <div class="note-submit-row">
              <button class="secondary-button" type="submit"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Save note</button>
            </div>
          </form>

          <div id="note-list" class="item-list note-list" aria-live="polite" aria-busy="true"></div>
        </section>
      </div>
    </main>

    <dialog id="edit-dialog" class="edit-dialog" aria-labelledby="edit-heading">
      <form id="edit-form" class="edit-form">
        <div class="dialog-topline">
          <div>
            <h2 id="edit-heading">Edit item</h2>
          </div>
          <button id="close-dialog" class="icon-button close-button" type="button" aria-label="Close editor" title="Close"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </div>
        <div id="edit-fields" class="edit-fields"></div>
        <div class="dialog-actions">
          <button id="cancel-edit" class="quiet-button" type="button">Cancel</button>
          <button class="primary-button" type="submit">Save changes</button>
        </div>
      </form>
    </dialog>

    <dialog id="delete-dialog" class="delete-dialog" aria-labelledby="delete-heading" aria-describedby="delete-description">
      <form id="delete-form" class="delete-card">
        <div class="warning-icon" aria-hidden="true">
          <svg class="ui-icon" viewBox="0 0 24 24"><path d="M12 8v5m0 4h.01M10.3 3.9 2.2 18a1.4 1.4 0 0 0 1.2 2.1h17.2a1.4 1.4 0 0 0 1.2-2.1l-8.1-14.1a1.4 1.4 0 0 0-2.4 0Z"/></svg>
        </div>
        <h2 id="delete-heading">Delete this task?</h2>
        <p id="delete-description" class="delete-description">This item will be permanently deleted:</p>
        <p id="delete-item-name" class="delete-item-name"></p>
        <div class="delete-actions">
          <button id="cancel-delete" class="quiet-button" type="button">Cancel</button>
          <button id="confirm-delete" class="delete-confirm-button" type="submit">Delete</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
